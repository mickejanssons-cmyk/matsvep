name: Uppdatera priser och recept
on:
  schedule:
    - cron: '17 2 * * *'   # varje natt ca 03:17 svensk tid
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: update, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/update.mjs
      - name: Spara ny data
        run: |
          git config user.name "matsvep-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/data.json
          git diff --cached --quiet || git commit -m "Nya priser och recept $(date -u +%F)"
          git push
