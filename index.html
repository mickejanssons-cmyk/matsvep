<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Matsvep">
<meta name="theme-color" content="#ffffff">
<meta name="referrer" content="no-referrer">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Matsvep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--ink:#15171a;--mut:#6d7177;--soft:#f4f3f0;--line:#ebe9e4;--card:#fff;--green:#23704a;--green2:#e6f2ec;--red:#e4572e;--tag:#ffd23f;--shadow:0 10px 30px rgba(20,20,20,.10)}
@media (prefers-color-scheme:dark){:root{--bg:#111312;--ink:#f2f1ee;--mut:#9ea19f;--soft:#1c1f1d;--line:#2a2e2b;--card:#191c1a;--green:#4cc286;--green2:#173326;--shadow:0 10px 30px rgba(0,0,0,.4)}}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 'Plus Jakarta Sans',system-ui,sans-serif;overflow-x:clip}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
img{display:block}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(10px + env(safe-area-inset-top)) 18px 12px;border-bottom:1px solid var(--line)}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hi{font-size:13px;color:var(--mut);font-weight:600;line-height:1}
.brand{font-weight:800;font-size:22px;letter-spacing:-.03em}
.brand span{color:var(--green)}
.store{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-weight:700;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%}
.budget{margin-top:10px;display:flex;align-items:center;gap:12px}
.ring{width:46px;height:46px;flex:none}
.bt{flex:1}
.bt b{font-size:20px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.bt small{display:block;color:var(--mut);font-size:13px}
main{padding:16px 18px calc(110px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.view{display:none}.view.on{display:block}
h1{font-size:28px;line-height:1.1;margin:4px 0 14px;font-weight:800;letter-spacing:-.03em}
h3{font-size:17px;margin:22px 0 8px;font-weight:700}
.mut{color:var(--mut)}.small{font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{flex:1 1 150px;display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;color:var(--mut);font-weight:600}
input[type=number]{background:var(--soft);border:1px solid transparent;border-radius:14px;padding:12px 14px;font-size:17px;font-weight:700;width:100%}
.step{display:flex;align-items:center;background:var(--soft);border-radius:14px}
.step button{width:46px;height:48px;border:0;background:none;font-size:22px;font-weight:700}
.step span{min-width:30px;text-align:center;font-weight:800;font-size:17px}
.btn{min-height:46px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:10px 16px;font-weight:700}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}
.btn.ghost{background:var(--soft);border-color:transparent}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;border:0;background:var(--soft);border-radius:999px;padding:9px 15px;font-weight:700;font-size:14px;min-height:40px;white-space:nowrap}
.pill.on{background:var(--ink);color:var(--bg)}
.pill[disabled]{opacity:.35}
/* vecka */
.days{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.day{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px}
.dayh{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 8px;font-weight:800}
.dayh small{font-weight:600;color:var(--mut)}
.meals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.meal{position:relative;border:0;border-radius:14px;aspect-ratio:1/1.1;overflow:hidden;padding:0;background:var(--soft);text-align:left;color:#fff}
.meal img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.meal .sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.75))}
.meal .lab{hyphens:auto;overflow-wrap:anywhere;position:absolute;left:8px;right:8px;bottom:7px;font-size:12px;font-weight:700;line-height:1.2;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meal .ty{position:absolute;left:8px;top:7px;font-size:10.5px;font-weight:800;letter-spacing:.02em;background:rgba(0,0,0,.45);padding:2px 7px;border-radius:999px}
.meal.empty{color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1.5px dashed var(--line);background:none}
.meal.empty b{font-size:24px;line-height:1;color:var(--green)}
.meal.empty span{font-size:12px;font-weight:700}
.meal.off{opacity:.35;border:1.5px dashed var(--line);background:none;color:var(--mut);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.editing .meal{border:2px solid var(--line)}
.editing .meal.sel{border-color:var(--green);background:var(--green2);color:var(--green);opacity:1}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.stat{background:var(--soft);border-radius:16px;padding:12px}
.stat b{display:block;font-size:19px;font-weight:800;white-space:nowrap;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--mut)}
/* svep */
.slot{margin:12px 2px 10px;font-size:14px;color:var(--mut)}
.slot b{color:var(--ink)}
.deck{position:relative;height:min(64vh,560px);min-height:440px;max-width:440px;margin:0 auto}
.card{position:absolute;inset:0;border-radius:28px;overflow:hidden;background:#222;box-shadow:var(--shadow);touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .28s ease;color:#fff}
.card.drag{transition:none}
.card.b1{transform:scale(.95) translateY(16px);pointer-events:none}
.card.b2{transform:scale(.9) translateY(32px);pointer-events:none;opacity:.6}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.card .ph{position:absolute;inset:0;background:linear-gradient(135deg,#2f6f4f,#e4572e)}
.card .grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25) 0,rgba(0,0,0,0) 25%,rgba(0,0,0,0) 45%,rgba(0,0,0,.85) 100%)}
.card .info{position:absolute;left:18px;right:18px;bottom:18px}
.card .nm{font-size:25px;font-weight:800;line-height:1.1;letter-spacing:-.02em;text-wrap:balance}
.card .meta{font-size:14px;opacity:.9;margin-top:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.18);backdrop-filter:blur(6px)}
.chip.g{background:#2fbf71}.chip.y{background:var(--tag);color:#15171a}.chip.r{background:var(--red)}
.srcb{position:absolute;left:16px;top:16px;font-size:12px;font-weight:800;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.92);color:#15171a}
.price{position:absolute;right:14px;top:14px;background:var(--tag);color:#15171a;border-radius:14px;padding:8px 12px 7px;text-align:right;line-height:1;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.price b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.price span{font-size:11px;font-weight:700}
.stamp{position:absolute;top:70px;font-size:30px;font-weight:800;padding:4px 14px;border:4px solid;border-radius:12px;opacity:0;letter-spacing:.04em}
.stamp.yes{left:20px;color:#2fbf71;transform:rotate(-12deg)}
.stamp.no{right:20px;color:var(--red);transform:rotate(12deg)}
.actions{display:flex;justify-content:center;align-items:center;gap:22px;margin-top:18px}
.rb{width:66px;height:66px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center}
.rb.s{width:52px;height:52px}
.rb svg{width:30px;height:30px}
.empty{text-align:center;padding:44px 18px;background:var(--soft);border-radius:24px}
.empty h2{margin:0 0 6px;font-size:20px}
.tog{display:flex;align-items:center;gap:10px;font-size:14px;margin-top:16px;color:var(--mut)}
.tog input{width:20px;height:20px;accent-color:var(--green)}
/* lista */
.tot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:4px 0 14px}
.tot .stat:first-child{background:var(--ink);color:var(--bg)}.tot .stat:first-child span{color:var(--bg);opacity:.75}
.cat{font-size:13px;font-weight:800;color:var(--mut);margin:20px 0 4px;text-transform:none}
.item{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.item input{width:22px;height:22px;margin-top:2px;accent-color:var(--green)}
.item .n{font-weight:700}
.item .d{font-size:13px;color:var(--mut)}
.item .p{font-weight:800;white-space:nowrap;text-align:right}
.item .p small{display:block;font-weight:600;font-size:11.5px;color:var(--mut)}
.item.done .n{text-decoration:line-through;opacity:.5}
.lk{border:0;background:none;padding:4px 0;font-size:13px;font-weight:700;color:var(--green)}
.off{display:inline-block;font-size:11px;font-weight:800;background:var(--tag);color:#15171a;border-radius:6px;padding:1px 6px;margin-left:4px}
/* butik */
.stores{display:flex;flex-direction:column;gap:10px}
.st{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;border:2px solid var(--line);border-radius:18px;padding:12px 14px;background:var(--card);text-align:left}
.st.on{border-color:var(--green)}
.st .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:13px}
.st .t b{display:block}
.st .t small{color:var(--mut);font-size:12.5px}
.st .v{font-weight:800;font-size:18px;white-space:nowrap;text-align:right}
.st .v small{display:block;font-size:11.5px;color:var(--mut);font-weight:600}
.bar{height:6px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--green)}
.note{font-size:13px;color:var(--mut);background:var(--soft);border-radius:14px;padding:12px 14px;margin-top:12px}
.ofr{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.ofr img{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:8px}
/* flikar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--mut);min-height:52px;position:relative}
.tabs svg{width:25px;height:25px}
.tabs button.on{color:var(--green)}
.badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:10.5px;border-radius:999px;padding:1px 6px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:92vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;transform:translateY(105%);transition:transform .28s;max-width:720px;margin:0 auto;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.sheet.on{transform:none}
.hero{position:relative;height:260px;background:linear-gradient(135deg,#2f6f4f,#e4572e)}
.hero img{width:100%;height:100%;object-fit:cover}
.hero .x{position:absolute;right:14px;top:14px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#15171a;font-size:20px;font-weight:700}
.sb{padding:16px 18px}
.ing{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.ing span:last-child{color:var(--mut);white-space:nowrap}
.est{font-size:11px;font-weight:700;background:var(--soft);color:var(--mut);border-radius:6px;padding:1px 6px;margin-left:4px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:700;font-size:14px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast u{cursor:pointer}
.loading{padding:60px 20px;text-align:center;color:var(--mut)}
@media (prefers-reduced-motion:reduce){.card,.sheet,.toast,.scrim{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="toprow">
    <div><div class="hi" id="hi">Hej Micke</div><div class="brand">Mat<span>svep</span></div></div>
    <button class="store" id="storeBtn" type="button"><i class="dot" id="storeDot"></i><span id="storeName">Willys</span></button>
  </div>
  <div class="budget">
    <svg class="ring" viewBox="0 0 46 46" aria-hidden="true"><circle cx="23" cy="23" r="19" fill="none" stroke="var(--soft)" stroke-width="6"/><circle id="ringArc" cx="23" cy="23" r="19" fill="none" stroke="var(--green)" stroke-width="6" stroke-linecap="round" stroke-dasharray="0 120" transform="rotate(-90 23 23)"/></svg>
    <div class="bt"><b id="bVal">0 kr</b> <span class="mut small" id="bOf"></span><small id="bSub"></small></div>
  </div>
</header>

<main>
  <div class="loading" id="loading">Hämtar recept och priser…</div>

  <section class="view" id="v-vecka">
    <h1>Din vecka</h1>
    <div class="row">
      <div class="field"><label for="budget">Veckobudget (kr)</label><input id="budget" type="number" inputmode="numeric" min="0" step="50"></div>
      <div class="field" style="flex:0 0 auto"><label>Personer</label><div class="step"><button type="button" id="pM" aria-label="Färre">−</button><span id="pV">2</span><button type="button" id="pP" aria-label="Fler">+</button></div></div>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn ghost" type="button" id="editBtn" style="flex:1">Välj när du äter hemma</button>
      <button class="btn ghost" type="button" id="clearBtn">Rensa</button>
    </div>
    <p class="small mut" id="editHint" style="display:none;margin:8px 2px 0">Tryck på måltiderna du äter hemma. Tryck Klar när du är nöjd.</p>
    <div class="days" id="days"></div>
    <div class="stats" id="wstats"></div>
  </section>

  <section class="view" id="v-svep">
    <div class="pills" id="typePills"></div>
    <div class="pills" id="proPills" style="margin-top:8px"></div>
    <div class="pills" id="srcPills" style="margin-top:8px"></div>
    <p class="slot" id="slot"></p>
    <div class="deck" id="deck"></div>
    <div class="actions" id="acts">
      <button class="rb" type="button" id="noBtn" aria-label="Nej tack"><svg viewBox="0 0 24 24" fill="none" stroke="#e4572e" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <button class="rb s" type="button" id="infoBtn" aria-label="Visa receptet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button>
      <button class="rb" type="button" id="yesBtn" aria-label="Välj"><svg viewBox="0 0 24 24" fill="#2fbf71"><path d="M12 21s-7.5-4.6-9.5-9.2C1 8.4 3.2 4.5 7 4.5c2.1 0 3.7 1.2 5 3 1.3-1.8 2.9-3 5-3 3.8 0 6 3.9 4.5 7.3C19.5 16.4 12 21 12 21z"/></svg></button>
    </div>
    <label class="tog"><input type="checkbox" id="showOver"> Visa även recept som spräcker budgeten</label>
  </section>

  <section class="view" id="v-lista">
    <h1>Inköpslista</h1>
    <div class="tot" id="tot"></div>
    <div class="row"><button class="btn ghost" type="button" id="copyBtn">Kopiera listan</button><span class="small mut" id="listInfo"></span></div>
    <div id="list"></div>
  </section>

  <section class="view" id="v-butik">
    <h1>Butiker</h1>
    <p class="mut small" style="margin-top:-6px">Vad din inköpslista kostar i butikerna nära Värnhem. Tryck för att välja.</p>
    <div class="stores" id="stores"></div>
    <div class="note" id="priceNote"></div>
    <h3>Veckans erbjudanden</h3>
    <div class="pills" id="offTabs"></div>
    <div id="offers"></div>
    <div class="note small" id="about"></div>
  </section>
</main>

<nav class="tabs" id="tabs">
  <button type="button" data-v="vecka"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Vecka</button>
  <button type="button" data-v="svep"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="6" y="3.5" width="12" height="17" rx="3" transform="rotate(8 12 12)"/><path d="M12 15s-3-1.8-3-3.8a1.6 1.6 0 013-.8 1.6 1.6 0 013 .8c0 2-3 3.8-3 3.8z"/></svg>Svep</button>
  <button type="button" data-v="lista"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h2l2.2 10.5h10.6L20 8H6.2"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg>Lista<span class="badge" id="badge" style="display:none"></span></button>
  <button type="button" data-v="butik"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 9.5L5.5 4h13L20 9.5M4 9.5h16M4 9.5V20h16V9.5M9.5 20v-5h5v5"/></svg>Butik</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kr=v=>Math.round(v).toLocaleString('sv-SE')+' kr';
const kr1=v=>(Math.round(v*10)/10).toLocaleString('sv-SE',{maximumFractionDigits:1})+' kr';
const DAYS=['Måndag','Tisdag','Onsdag','Torsdag','Fredag','Lördag','Söndag'];
const TY={f:'Frukost',l:'Lunch',m:'Middag'};
const STORES=['willys','lidl','ica','coop'];
const SCOL={willys:'#d6001c',lidl:'#0050aa',ica:'#e3000b',coop:'#00a142'};
const SRC=['Alla','ICA','Coop','Willys','Lidl','Linas'];
const KEY='matsvep-web-v1';
let D=null,P={},R=[],RID={};

function defaults(){const en={};for(let d=0;d<7;d++){en[d+'f']=1;en[d+'m']=1;if(d>4)en[d+'l']=1}
  return {budget:900,pers:2,store:'willys',en,plan:{},have:{},bought:{},rej:{f:[],l:[],m:[]},tab:'svep',type:'m',src:'Alla',over:false,pro:{not:1,fisk:1,kyck:1,flask:1,veg:0},offStore:null}}
let S=defaults();
try{const o=JSON.parse(localStorage.getItem(KEY)||'null');if(o)S=Object.assign(S,o,{rej:Object.assign({f:[],l:[],m:[]},o.rej||{}),pro:Object.assign({not:1,fisk:1,kyck:1,flask:1,veg:0},o.pro||{})})}catch(e){}
const PRO={not:'Nötkött',fisk:'Fisk',kyck:'Kyckling',flask:'Fläsk',veg:'Vegetariskt'};
const PROID={not:['notfars','blandfars','hogrev','notbit'],fisk:['lax','torsk','rakor','tonfisk'],kyck:['kyckling','kycklinglar','kycklingklubba','kycklingfars'],flask:['flask','bacon','kotlett','flaskfile','falukorv','skinka','flaskfars']};
function proOf(r){if(r.pro)return r.pro;const ids=new Set(r.i.map(x=>x[0]));const k=Object.keys(PROID).filter(k=>PROID[k].some(id=>ids.has(id)));return r.pro=k.length?k:['veg']}
let sT;const save=()=>{clearTimeout(sT);sT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},150)};

/* ---------- priser ---------- */
function price(id,st){st=st||S.store;const p=P[id];if(!p)return 0;let v=p.price*(D.stores[st].f||1);const o=(D.offers[st]||{})[id];if(o)v*=o.ratio;return v}
const rec=id=>RID[id];
const planned=()=>Object.keys(S.plan).filter(k=>S.en[k]&&rec(S.plan[k])).sort();
const planIds=()=>planned().map(k=>S.plan[k]);
function needs(ids){const m={};ids.forEach(rid=>{const r=rec(rid);if(!r)return;r.i.forEach(([id,a])=>{if(!P[id])return;const x=m[id]||(m[id]={id,a:0,uses:[]});x.a+=a/r.p*S.pers;if(!x.uses.includes(r.n))x.uses.push(r.n)})});return m}
const packs=x=>Math.max(1,Math.ceil(x.a/P[x.id].pk-1e-9));
function kassa(ids,st){const m=needs(ids);let t=0;for(const id in m){if(S.have[id])continue;t+=packs(m[id])*price(id,st)}return t}
function eaten(ids,st){const m=needs(ids);let t=0;for(const id in m)t+=m[id].a/P[id].pk*price(id,st);return t}
const portion=(r,st)=>r.i.reduce((t,[id,a])=>P[id]?t+a/r.p/P[id].pk*price(id,st):t,0);
function amt(v,u){if(u==='g')return v>=1000?(Math.round(v/100)/10).toLocaleString('sv-SE')+' kg':Math.round(v)+' g';if(u==='ml')return v>=1000?(Math.round(v/100)/10).toLocaleString('sv-SE')+' l':v<15?Math.max(.5,Math.round(v/7.5)/2).toLocaleString('sv-SE')+' msk':(Math.round(v/10)/10).toLocaleString('sv-SE')+' dl';return(Math.round(v*10)/10).toLocaleString('sv-SE')+' st'}
const packLbl=p=>p.unit==='st'?(p.pk===1?'1 st':p.pk+' st'):amt(p.pk,p.unit);
const img=(r,cls)=>r.img?`<img src="${esc(r.img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()"${cls?` class="${cls}"`:''}>`:'';

/* ---------- topp ---------- */
function renderTop(){
  const ids=planIds(),k=kassa(ids),e=eaten(ids);
  $('#storeName').textContent=D.stores[S.store].n.split(' ')[0];$('#storeDot').style.background=SCOL[S.store];
  $('#bVal').textContent=kr(k);$('#bOf').textContent='av '+kr(S.budget);
  const left=S.budget-k;$('#bSub').textContent=left>=0?kr(left)+' kvar · maten ni äter '+kr(e):'Över budget med '+kr(-left);
  const pct=S.budget>0?Math.min(1,k/S.budget):0;const a=$('#ringArc');a.setAttribute('stroke-dasharray',(pct*119.4).toFixed(1)+' 120');a.setAttribute('stroke',k>S.budget?'var(--red)':'var(--green)');
  const n=Object.keys(needs(ids)).filter(id=>!S.have[id]).length;const b=$('#badge');b.style.display=n?'':'none';b.textContent=n;
}

/* ---------- vecka ---------- */
let editing=false;
function renderWeek(){
  $('#budget').value=S.budget;$('#pV').textContent=S.pers;
  $('#editBtn').textContent=editing?'Klar':'Välj när du äter hemma';$('#editBtn').className='btn '+(editing?'pri':'ghost');$('#editHint').style.display=editing?'':'none';
  $('#days').className='days'+(editing?' editing':'');
  $('#days').innerHTML=DAYS.map((dn,d)=>{
    const ids=['f','l','m'].map(t=>S.en[d+t]&&S.plan[d+t]&&rec(S.plan[d+t])?S.plan[d+t]:null).filter(Boolean);
    const sum=ids.reduce((t,id)=>t+portion(rec(id))*S.pers,0);
    return `<div class="day"><div class="dayh">${dn}<small>${sum?kr(sum)+' i råvaror':''}</small></div><div class="meals">${['f','l','m'].map(t=>{
      const k=d+t,on=!!S.en[k],r=on&&S.plan[k]?rec(S.plan[k]):null;
      if(editing)return `<button type="button" class="meal off ${on?'sel':''}" data-k="${k}" aria-pressed="${on}">${TY[t]}</button>`;
      if(!on)return `<button type="button" class="meal off" disabled>${TY[t]}<br>borta</button>`;
      if(r)return `<button type="button" class="meal" data-k="${k}">${img(r)}<i class="sh"></i><span class="ty">${TY[t]}</span><span class="lab">${esc(r.n)}</span></button>`;
      return `<button type="button" class="meal empty" data-k="${k}"><b>+</b><span>${TY[t]}</span></button>`}).join('')}</div></div>`}).join('');
  const slots=Object.keys(S.en).filter(k=>S.en[k]).length,ids=planIds(),k=kassa(ids),e=eaten(ids),port=ids.length*S.pers;
  $('#wstats').innerHTML=`<div class="stat"><b>${ids.length}/${slots}</b><span>måltider valda</span></div><div class="stat"><b>${ids.length?kr1(e/port):'–'}</b><span>per portion</span></div><div class="stat"><b>${ids.length?kr1(k/ids.length):'–'}</b><span>per måltid vid kassan</span></div>`;
}
$('#days').addEventListener('click',e=>{const c=e.target.closest('.meal');if(!c||c.disabled)return;const k=c.dataset.k;if(!k)return;
  if(editing){S.en[k]=S.en[k]?0:1;save();render();return}
  if(S.plan[k]&&rec(S.plan[k]))openSheet(S.plan[k],{slot:k});else{S.type=k[1];target=k;go('svep')}});
$('#editBtn').onclick=()=>{editing=!editing;renderWeek()};
$('#clearBtn').onclick=()=>{if(!Object.keys(S.plan).length)return;const o=S.plan;S.plan={};S.bought={};save();render();toast('Veckan rensad',()=>{S.plan=o;save();render()})};
$('#budget').addEventListener('change',e=>{S.budget=Math.max(0,+e.target.value||0);save();render()});
$('#pM').onclick=()=>{S.pers=Math.max(1,S.pers-1);save();render()};$('#pP').onclick=()=>{S.pers=Math.min(12,S.pers+1);save();render()};

/* ---------- svep ---------- */
let target=null,deck=[];const jit={};const J=id=>jit[id]??(jit[id]=.8+Math.random()*.4);
function freeSlot(t){if(target&&target[1]===t&&S.en[target]&&!(S.plan[target]&&rec(S.plan[target])))return target;for(let d=0;d<7;d++){const k=d+t;if(S.en[k]&&!(S.plan[k]&&rec(S.plan[k])))return k}return null}
function buildDeck(t){
  const ids=planIds(),base=kassa(ids),used=new Set(ids),inWeek=new Set(Object.keys(needs(ids)));
  let c=R.filter(r=>(t==='f'?r.t.includes('f'):r.t.includes(t)||(r.t==='lm'))&&!(t!=='f'&&r.t==='f')&&!used.has(r.id)&&!S.rej[t].includes(r.id)&&(S.src==='Alla'||r.src===S.src)&&(t==='f'||proOf(r).some(k=>S.pro[k])));
  c=c.map(r=>{const k2=kassa(ids.concat(r.id));return{r,marg:k2-base,fits:k2<=S.budget,share:r.i.filter(([id])=>inWeek.has(id)&&!P[id]?.base).length,offer:r.i.some(([id])=>(D.offers[S.store]||{})[id]),boost:proOf(r).some(k=>k==='not'||k==='fisk')?.75:1}});
  if(!S.over)c=c.filter(x=>x.fits);
  return c.sort((a,b)=>(b.fits-a.fits)||(a.marg*a.boost*J(a.r.id)-b.marg*b.boost*J(b.r.id)));
}
function renderSvep(){
  $('#typePills').innerHTML=['f','l','m'].map(t=>{const tot=[0,1,2,3,4,5,6].filter(d=>S.en[d+t]).length,left=[0,1,2,3,4,5,6].filter(d=>S.en[d+t]&&!(S.plan[d+t]&&rec(S.plan[d+t]))).length;return `<button type="button" class="pill ${S.type===t?'on':''}" data-t="${t}" ${tot?'':'disabled'}>${TY[t]}${tot?' · '+left+' kvar':''}</button>`}).join('');
  $('#proPills').innerHTML=S.type==='f'?'':Object.keys(PRO).map(k=>`<button type="button" class="pill ${S.pro[k]?'on':''}" data-p="${k}" aria-pressed="${!!S.pro[k]}">${PRO[k]}</button>`).join('');
  $('#srcPills').innerHTML=SRC.map(s=>`<button type="button" class="pill ${S.src===s?'on':''}" data-s="${s}">${s==='Alla'?'Alla recept':s}</button>`).join('');
  $('#showOver').checked=!!S.over;
  const t=S.type,slot=freeSlot(t),dk=$('#deck');$('#acts').style.visibility='hidden';
  if(!slot){const tot=[0,1,2,3,4,5,6].filter(d=>S.en[d+t]).length;$('#slot').textContent='';
    dk.innerHTML=`<div class="empty"><h2>${tot?'Alla '+TY[t].toLowerCase()+'ar är valda':'Ingen '+TY[t].toLowerCase()+' hemma'}</h2><p class="mut">${tot?'Välj en annan måltid ovan eller titta på inköpslistan.':'Under Vecka väljer du när du äter hemma.'}</p><button class="btn pri" type="button" data-go="${tot?'lista':'vecka'}">${tot?'Visa inköpslistan':'Gå till Vecka'}</button></div>`;return}
  const left=S.budget-kassa(planIds()),emptyN=Object.keys(S.en).filter(k=>S.en[k]&&!(S.plan[k]&&rec(S.plan[k]))).length;
  $('#slot').innerHTML=`<b>${DAYS[+slot[0]]} · ${TY[t].toLowerCase()}</b> · ${left>=0?kr(left)+' kvar, ca '+kr(left/Math.max(1,emptyN))+' per måltid':'redan över budget'}`;
  deck=buildDeck(t);
  if(!deck.length){dk.innerHTML=`<div class="empty"><h2>Slut på förslag</h2><p class="mut">${S.over?'Du har svept igenom alla recept här.':'Inga fler recept ryms i budgeten.'}</p><button class="btn pri" type="button" id="resetRej">Visa bortsvepta igen</button></div>`;return}
  $('#acts').style.visibility='visible';
  dk.innerHTML=deck.slice(0,3).map((x,i)=>cardHtml(x,i)).reverse().join('');bindTop();
}
function cardHtml(x,i){const r=x.r,pp=portion(r);const ch=[];
  if(x.share)ch.push(`<span class="chip g">Delar ${x.share} ${x.share>1?'varor':'vara'} med veckan</span>`);
  if(x.offer)ch.push(`<span class="chip y">Erbjudande på ${esc(D.stores[S.store].n.split(' ')[0])}</span>`);proOf(r).filter(k=>k!=='veg').forEach(k=>ch.push(`<span class="chip">${PRO[k]}</span>`));
  if(!x.fits)ch.push('<span class="chip r">Spräcker budgeten</span>');
  return `<article class="card ${i===1?'b1':i===2?'b2':''}" data-id="${r.id}" ${i===0?'tabindex="0"':''}><div class="ph"></div>${img(r)}<div class="grad"></div>
  <span class="srcb">${esc(r.src)}</span><div class="price"><span>vid kassan</span><b>+${kr(x.marg)}</b></div>
  <div class="stamp yes">JA</div><div class="stamp no">NEJ</div>
  <div class="info"><div class="nm">${esc(r.n)}</div><div class="meta">${r.min?r.min+' min · ':''}${kr1(pp)} per portion</div><div class="chips">${ch.join('')}</div></div></article>`}
function bindTop(){const c=$('#deck .card:last-child');if(!c)return;let sx=0,sy=0,dx=0,dy=0,down=false;const y=c.querySelector('.stamp.yes'),n=c.querySelector('.stamp.no');
  c.addEventListener('pointerdown',e=>{down=true;sx=e.clientX;sy=e.clientY;dx=dy=0;c.classList.add('drag');try{c.setPointerCapture(e.pointerId)}catch(_){}});
  c.addEventListener('pointermove',e=>{if(!down)return;dx=e.clientX-sx;dy=e.clientY-sy;c.style.transform=`translate(${dx}px,${dy*.25}px) rotate(${dx/16}deg)`;y.style.opacity=Math.max(0,Math.min(1,dx/90));n.style.opacity=Math.max(0,Math.min(1,-dx/90))});
  const end=()=>{if(!down)return;down=false;c.classList.remove('drag');if(Math.abs(dx)<6&&Math.abs(dy)<6){c.style.transform='';openSheet(c.dataset.id,{deck:1});return}if(dx>90)decide(true);else if(dx<-90)decide(false);else{c.style.transform='';y.style.opacity=0;n.style.opacity=0}};
  c.addEventListener('pointerup',end);c.addEventListener('pointercancel',()=>{down=false;c.classList.remove('drag');c.style.transform=''});
  c.addEventListener('keydown',e=>{if(e.key==='ArrowRight')decide(true);if(e.key==='ArrowLeft')decide(false);if(e.key==='Enter')openSheet(c.dataset.id,{deck:1})})}
let busy=false;
function decide(ok){if(busy)return;const c=$('#deck .card:last-child');if(!c)return;const id=c.dataset.id;busy=true;
  c.style.transform=`translate(${ok?650:-650}px,40px) rotate(${ok?28:-28}deg)`;c.querySelector(ok?'.stamp.yes':'.stamp.no').style.opacity=1;
  setTimeout(()=>{busy=false;const t=S.type;
    if(ok){const slot=freeSlot(t);if(slot){S.plan[slot]=id;target=null;toast(rec(id).n+' → '+DAYS[+slot[0]].toLowerCase(),()=>{delete S.plan[slot];save();render()})}}
    else{S.rej[t].push(id);toast('Bortsvept',()=>{S.rej[t]=S.rej[t].filter(x=>x!==id);save();render()})}
    save();render()},250)}
$('#yesBtn').onclick=()=>decide(true);$('#noBtn').onclick=()=>decide(false);
$('#infoBtn').onclick=()=>{const c=$('#deck .card:last-child');if(c)openSheet(c.dataset.id,{deck:1})};
$('#typePills').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b||b.disabled)return;S.type=b.dataset.t;target=null;save();renderSvep()});
$('#proPills').addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(!b)return;const k=b.dataset.p;S.pro[k]=S.pro[k]?0:1;if(!Object.values(S.pro).some(Boolean))S.pro[k]=1;save();renderSvep()});
$('#srcPills').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;S.src=b.dataset.s;save();renderSvep()});
$('#showOver').onchange=e=>{S.over=e.target.checked;save();renderSvep()};
$('#deck').addEventListener('click',e=>{if(e.target.id==='resetRej'){S.rej[S.type]=[];save();renderSvep()}const g=e.target.closest('[data-go]');if(g)go(g.dataset.go)});

/* ---------- lista ---------- */
function renderList(){
  const ids=planIds(),m=needs(ids),k=kassa(ids),e=eaten(ids);let left=0;
  for(const id in m){if(S.have[id])continue;left+=(packs(m[id])*P[id].pk-m[id].a)/P[id].pk*price(id)}
  $('#tot').innerHTML=`<div class="stat"><b>${kr(k)}</b><span>vid kassan</span></div><div class="stat"><b>${kr(e)}</b><span>maten ni äter</span></div><div class="stat"><b>${kr(left)}</b><span>blir över</span></div>`;
  if(!ids.length){$('#list').innerHTML='<div class="empty" style="margin-top:14px"><p class="mut">Listan fylls när du väljer måltider.</p><button class="btn pri" type="button" data-go="svep">Börja svepa</button></div>';$('#listInfo').textContent='';return}
  const buy=Object.values(m).filter(x=>!S.have[x.id]),home=Object.values(m).filter(x=>S.have[x.id]);
  $('#listInfo').textContent=buy.filter(x=>S.bought[x.id]).length+' av '+buy.length+' i korgen';
  let h='';for(const c in D.cats){const rows=buy.filter(x=>P[x.id].c===c).sort((a,b)=>P[a.id].n.localeCompare(P[b.id].n,'sv'));if(rows.length)h+=`<div class="cat">${D.cats[c]}</div>`+rows.map(x=>item(x,0)).join('')}
  if(home.length)h+=`<div class="cat">Har hemma</div>`+home.map(x=>item(x,1)).join('');
  h+='<p class="small mut" style="margin-top:14px">Salt, peppar, kryddor och vatten räknas inte. Tryck "Har hemma" på det du redan har.</p>';
  $('#list').innerHTML=h}
function item(x,home){const p=P[x.id],n=packs(x),rest=n*p.pk-x.a,o=(D.offers[S.store]||{})[x.id];
  const buy=p.loose?(p.unit==='st'?n+' st':'ca '+amt(n*p.pk,p.unit)):(n+' × '+packLbl(p));
  return `<div class="item ${S.bought[x.id]&&!home?'done':''}">${home?'<span></span>':`<input type="checkbox" data-b="${x.id}" ${S.bought[x.id]?'checked':''} aria-label="Köpt ${esc(p.n)}">`}
  <div><div class="n">${esc(p.n)}${o?'<span class="off">Erbjudande</span>':''}</div><div class="d">Går åt ${amt(x.a,p.unit)}${home?'':' · köp '+buy+(rest>.01&&!p.loose?' · över '+amt(rest,p.unit):'')}</div><div class="d">${x.uses.map(esc).join(', ')}</div>
  <button class="lk" type="button" data-h="${x.id}">${home?'Behöver köpa':'Har hemma'}</button></div>
  <div class="p">${home?'<span class="mut">–</span>':kr1(n*price(x.id))+`<small>${esc(p.wn)}</small>`}</div></div>`}
$('#list').addEventListener('change',e=>{const id=e.target.dataset.b;if(id){S.bought[id]=e.target.checked;save();renderList()}});
$('#list').addEventListener('click',e=>{const h=e.target.closest('[data-h]');if(h){S.have[h.dataset.h]=!S.have[h.dataset.h];save();render();return}const g=e.target.closest('[data-go]');if(g)go(g.dataset.go)});
$('#copyBtn').onclick=async()=>{const ids=planIds(),m=needs(ids);if(!ids.length)return toast('Listan är tom');
  let t=`Inköpslista ${D.stores[S.store].n} – ca ${kr(kassa(ids))}\n`;for(const c in D.cats){const rows=Object.values(m).filter(x=>!S.have[x.id]&&P[x.id].c===c);if(rows.length)t+=`\n${D.cats[c]}\n`+rows.map(x=>`☐ ${P[x.id].n} – ${packs(x)} × ${packLbl(P[x.id])}`).join('\n')+'\n'}
  t+='\nMeny:\n'+planned().map(k=>`${DAYS[+k[0]].slice(0,3)} ${TY[k[1]].toLowerCase()}: ${rec(S.plan[k]).n}`).join('\n');
  try{await navigator.clipboard.writeText(t);toast('Listan kopierad')}catch(_){toast('Kunde inte kopiera')}};

  const d=new Date(D.updated);$('#about').innerHTML=`Uppdaterad ${d.toLocaleDateString('sv-SE')} kl ${d.toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'})}. ${R.length} recept (${['ICA','Lidl','Linas','Coop','Willys'].map(s=>s+' '+R.filter(r=>r.src===s).length).join(', ')}). ${D.products.length} varor med Willys-pris. Bilder och recept tillhör respektive sajt; tryck på ett recept för att öppna originalet.`;
}
$('#stores').addEventListener('click',e=>{const b=e.target.closest('[data-st]');if(!b)return;S.store=b.dataset.st;S.offStore=null;save();render()});
$('#offTabs').addEventListener('click',e=>{const b=e.target.closest('[data-o]');if(!b)return;S.offStore=b.dataset.o;save();renderStore()});
$('#storeBtn').onclick=()=>go('butik');

/* ---------- sheet ---------- */
function openSheet(id,o){const r=rec(id);if(!r)return;o=o||{};const pp=portion(r),host=new URL(r.u).hostname.replace('www.','');
  $('#sheet').innerHTML=`<div class="hero">${img(r)}<button class="x" type="button" id="shX" aria-label="Stäng">×</button></div><div class="sb">
  <div class="chips" style="margin-top:0"><span class="chip" style="background:var(--soft);color:var(--ink)">${esc(r.src)}</span>${r.min?`<span class="chip" style="background:var(--soft);color:var(--ink)">${r.min} min</span>`:''}</div>
  <h1 style="margin:10px 0 4px">${esc(r.n)}</h1>
  <p class="mut" style="margin:0">Råvaror för ${S.pers} portioner: <b style="color:var(--ink)">${kr1(pp*S.pers)}</b> · ${kr1(pp)}/portion på ${esc(D.stores[S.store].n)}</p>
  <a class="btn pri" style="display:flex;align-items:center;justify-content:center;margin-top:14px;text-decoration:none" href="${esc(r.u)}" target="_blank" rel="noopener">Gör så här – öppna på ${esc(host)}</a>
  <div class="row" style="margin-top:10px">${o.deck?'<button class="btn" type="button" id="shY" style="flex:1;color:var(--green)">Välj</button><button class="btn" type="button" id="shN" style="flex:1">Nej tack</button>':''}${o.slot?'<button class="btn" type="button" id="shS" style="flex:1">Byt rätt</button><button class="btn" type="button" id="shD" style="flex:1;color:var(--red)">Ta bort</button>':''}</div>
  <h3>Ingredienser (${r.p} portioner enligt ${esc(r.src)})</h3>${r.raw.map(x=>`<div class="ing"><span>${esc(x)}</span></div>`).join('')}
  <h3>Det appen räknar med för ${S.pers} portioner</h3>${r.i.filter(([x])=>P[x]).map(([x,a,es])=>`<div class="ing"><span>${esc(P[x].n)}${es?'<span class="est">uppskattad</span>':''}</span><span>${amt(a/r.p*S.pers,P[x].unit)}</span></div>`).join('')}
  <p class="small mut">${r.cover} % av ingredienserna (utom kryddor och vatten) har pris. "Uppskattad" = receptet anger ingen mängd, appen räknar en vanlig portion.</p></div>`;
  $('#sheet').classList.add('on');$('#scrim').classList.add('on');$('#sheet').scrollTop=0;$('#shX').onclick=closeSheet;
  if(o.deck){$('#shY').onclick=()=>{closeSheet();decide(true)};$('#shN').onclick=()=>{closeSheet();decide(false)}}
  if(o.slot){$('#shD').onclick=()=>{const old=S.plan[o.slot];delete S.plan[o.slot];save();closeSheet();render();toast('Borttagen',()=>{S.plan[o.slot]=old;save();render()})};
    $('#shS').onclick=()=>{const old=S.plan[o.slot];delete S.plan[o.slot];S.rej[o.slot[1]].push(old);S.type=o.slot[1];target=o.slot;save();closeSheet();go('svep')}}}
function closeSheet(){$('#sheet').classList.remove('on');$('#scrim').classList.remove('on')}
$('#scrim').onclick=closeSheet;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

/* ---------- toast & nav ---------- */
let tT,undo=null;function toast(m,u){const t=$('#toast');t.innerHTML=esc(m)+(u?' · <u id="undo">Ångra</u>':'');t.style.pointerEvents=u?'auto':'none';undo=u||null;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>{t.classList.remove('on');t.style.pointerEvents='none'},u?4000:2200)}
$('#toast').addEventListener('click',e=>{if(e.target.id==='undo'&&undo){undo();undo=null;$('#toast').classList.remove('on')}});
function go(v){S.tab=v;save();document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));window.scrollTo(0,0);render()}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b&&D)go(b.dataset.v)});
document.addEventListener('click',e=>{const g=e.target.closest('main [data-go]');if(g&&!e.target.closest('#deck,#list'))go(g.dataset.go)});
function render(){if(!D)return;renderTop();({vecka:renderWeek,svep:renderSvep,lista:renderList,butik:renderStore}[S.tab]||renderSvep)()}

/* ---------- start ---------- */
fetch('data/data.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{D=d;d.products.forEach(p=>P[p.id]=p);R=d.recipes;R.forEach(r=>RID[r.id]=r);
  d.products.forEach(p=>{if(p.base&&S.have[p.id]===undefined)S.have[p.id]=true});$('#loading').remove();go(S.tab||'svep')})
.catch(()=>{$('#loading').textContent='Kunde inte läsa data. Försök igen om en stund.'});
}
</script>
</body>
</html>
