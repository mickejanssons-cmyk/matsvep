  <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9fd65a"/><stop offset=".6" stop-color="#4f9a2c"/><stop offset="1" stop-color="#2d6b1a"/></linearGradient>
  <radialGradient id="lemon" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff6b0"/><stop offset=".75" stop-color="#ffe14a"/><stop offset=".9" stop-color="#f5f0d0"/><stop offset="1" stop-color="#e8c21a"/></radialGradient>
  <radialGradient id="heart" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#4fd08a"/><stop offset="1" stop-color="#1c8a4f"/></radialGradient>
  <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
